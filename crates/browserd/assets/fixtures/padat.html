<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Halaman padat</title></head><body>
<h1>Padat</h1><div id="isi"></div>
<script>
const isi = document.getElementById('isi');
for (let i = 0; i < 900; i += 1) {
  const d = document.createElement('div');
  d.className = 'baris';
  d.textContent = 'baris ' + i;
  isi.appendChild(d);
}
for (let i = 0; i < 60; i += 1) {
  const b = document.createElement('button');
  b.textContent = 'tombol ' + i;
  isi.appendChild(b);
}
</script></body></html>
