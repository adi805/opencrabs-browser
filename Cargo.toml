[workspace]
resolver = "3"
members = [
    "xtask",
    "crates/browserd",
    "crates/cdp",
    "crates/engine",
    "crates/lifecycle",
    "crates/store",
    "crates/policy",
    "crates/otp",
    "crates/control",
    "crates/testing",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/adi805/opencrabs-browser"
authors = ["Adi <adi805@users.noreply.github.com>"]

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
chacha20poly1305 = "0.11"
clap = { version = "4", features = ["derive", "env"] }
# Dekode badan HTTP menurut charset yang diklaim server. Dipakai `jaringan`.
encoding_rs = "0.8"
futures-util = "0.3"
html5ever = "0.40"
markup5ever_rcdom = "0.40"
nix = { version = "0.30", features = ["signal", "process", "fs"] }
# Encoder JPEG untuk `Page.captureScreenshot` format `jpeg`. Rust murni,
# tanpa dependensi, dan tidak memakai `unsafe` di jalur encode-nya.
jpeg-encoder = "0.6"
# Dekoder JPEG untuk melukis `<img>` dari byte dokumen. Rust murni, tanpa
# `unsafe` di jalur publiknya, dan sudah ada di lock lewat `image` di pohon
# dependensi dev; yang dipakai di sini hanya bagian JPEG-nya.
zune-jpeg = "0.5"
# Encoder PNG dengan pilihan level kompresi, supaya `optimizeForSpeed` punya
# arti konkret alih-alih diterima lalu diabaikan. Versi ini sudah ada di lock
# lewat `tiny-skia`, jadi tidak ada crate baru yang masuk.
png = "0.17"
# `parallel` mengaktifkan `unsafe impl Send/Sync for Runtime` di rquickjs-core.
# Tanpa fitur itu isolat tidak bisa hidup di dalam state axum/daemon yang
# multi-thread, dan `Engine: Send + Sync` tidak bisa dipenuhi. Fitur ini cuma
# menambah `std` + `tokio/rt-multi-thread`, bukan dependensi baru.
rquickjs = { version = "0.14", features = ["parallel"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taffy = "0.15"
thiserror = "2"
tiny-skia = { version = "0.11", features = ["png-format"] }
# Metrik TrueType untuk pengukuran teks. Fitur bawaannya (opentype-layout,
# apple-layout, variable-fonts, glyph-names) tidak dipakai: yang dibaca hanya
# `head`, `hhea`, `hmtx`, dan `cmap`, jadi tree tetap kecil.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
# Shaping HarfBuzz untuk teks yang bentuk glyph-nya bergantung konteks:
# aksara Arab bersambung, dan aksara Indic yang menukar urutan glyph
# (matra `i` mendahului konsonan). `ttf-parser` hanya memberi satu glyph per
# code point, jadi tanpa crate ini teks tersebut tergambar sebagai bentuk
# terpisah dalam urutan yang salah.
rustybuzz = { version = "0.20", default-features = false }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "process",
    "io-util",
    "time",
    "signal",
    "sync",
    "fs",
] }
tokio-tungstenite = "0.29"
# Klien HTTP untuk mengambil dokumen dari jaringan. Blocking, dipanggil di
# `spawn_blocking`, dan TLS-nya rustls: `deny.toml` melarang openssl.
# Fitur `charset` dipakai supaya halaman non-UTF8 tidak jadi teks rusak.
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip", "brotli", "charset"] }
# Penyelesaian URL relatif untuk `href` stylesheet terhadap URL akhir dokumen
# dan `<base href>`. Sudah ada di lock lewat `ureq`, jadi ini bukan crate baru
# yang masuk ke tree; yang ditambah hanya deklarasi langsungnya.
url = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# internal
cdp = { path = "crates/cdp" }
control = { path = "crates/control" }
engine = { path = "crates/engine" }
lifecycle = { path = "crates/lifecycle" }
otp = { path = "crates/otp" }
policy = { path = "crates/policy" }
store = { path = "crates/store" }
testing = { path = "crates/testing" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"