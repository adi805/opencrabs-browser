[workspace]
resolver = "3"
members = [
    "xtask",
    "crates/browserd",
    "crates/cdp",
    "crates/engine",
    "crates/lifecycle",
    "crates/store",
    "crates/policy",
    "crates/otp",
    "crates/control",
    "crates/testing",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/adi805/opencrabs-browser"
authors = ["Adi <adi805@users.noreply.github.com>"]

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
chacha20poly1305 = "0.11"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
nix = { version = "0.30", features = ["signal", "process", "fs"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "process",
    "io-util",
    "time",
    "signal",
    "sync",
    "fs",
] }
tokio-tungstenite = "0.29"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# internal
cdp = { path = "crates/cdp" }
control = { path = "crates/control" }
engine = { path = "crates/engine" }
lifecycle = { path = "crates/lifecycle" }
otp = { path = "crates/otp" }
policy = { path = "crates/policy" }
store = { path = "crates/store" }
testing = { path = "crates/testing" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"