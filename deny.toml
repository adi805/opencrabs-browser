[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
]
# Git dependency dilarang: repo harus bisa dibangun dari crates.io saja.
allow-git = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
# `CDLA-Permissive-2.0` adalah lisensi data untuk bundel sertifikat akar
# Mozilla yang dibawa `webpki-roots`. Ia permissive, bukan copyleft, dan
# tidak ada jalan lain: `ureq` + rustls mengambil akar dari crate ini, dan
# `native-tls` di Linux berarti openssl yang dilarang di [bans].
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]
confidence-threshold = 0.93