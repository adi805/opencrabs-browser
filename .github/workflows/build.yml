name: Build

# Jalur C (dokumen 06 §0): biner rilis.
#
# Repo ini publik, jadi runner standar tidak memakai kuota. Konsekuensinya
# build berat (rilis, arsitektur kedua, e2e Chrome bersih) dikerjakan di sini,
# bukan di laptop 4 core. Angka memori tetap diukur di laptop: PSS di runner
# adalah PSS mesin orang lain (dokumen 08 §1 batas 2).
#
# Belum ada tag sampai M2 selesai (dokumen 08 §5), jadi jalur ini dipakai
# lewat workflow_dispatch lebih dulu.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      profile:
        description: "Profil cargo yang dibangun"
        type: choice
        options: [release, dev]
        default: release

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "4"
  # Artefak ini dikirim ke mesin lain, jadi baseline ISA dipin eksplisit dan
  # tidak diserahkan ke bawaan runner. Tanpa pin, runner ubuntu26 membangun
  # dengan BMI2/AVX2 dan biner mati "Illegal instruction" di CPU yang tidak
  # punya fitur itu (run 43531270141: 689 instruksi BMI2, laptop Sandy Bridge
  # cuma punya avx/popcnt/sse4_2).
  RUSTFLAGS: "-C target-cpu=x86-64 -C target-feature=-bmi2,-bmi1"
  # RUSTFLAGS tidak pernah sampai ke compiler C. ring membawa kode BoringSSL
  # (CRYPTO_store_u32_be di crypto/internal.h:435) yang dikompilasi `cc`, dan
  # di runner Haswell+ gcc menerjemahkan bswap menjadi `movbe` — fitur Haswell
  # yang tidak ada di Sandy Bridge. Itu yang membunuh `browserd keygen`
  # (SIGILL di offset 0xda00f1, run 43539289311). Flag dari env cc-rs ditempel
  # paling akhir, jadi `-march=x86-64` di sini menimpa apa pun yang disuntik
  # toolchain runner.
  CFLAGS: "-O2 -march=x86-64 -mtune=generic"
  CXXFLAGS: "-O2 -march=x86-64 -mtune=generic"
  CFLAGS_x86_64_unknown_linux_gnu: "-O2 -march=x86-64 -mtune=generic"
  CXXFLAGS_x86_64_unknown_linux_gnu: "-O2 -march=x86-64 -mtune=generic"

jobs:
  build:
    name: build x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup show active-toolchain
          rustc -vV

      - name: Lingkungan build dan baseline ISA
        run: |
          echo "RUSTFLAGS=${RUSTFLAGS:-<kosong>}"
          echo "CARGO_BUILD_RUSTFLAGS=${CARGO_BUILD_RUSTFLAGS:-<kosong>}"
          echo "--- ~/.cargo/config.toml ---"
          cat ~/.cargo/config.toml 2>/dev/null || echo "(tidak ada)"
          echo "--- target_feature yang dijanjikan artefak ---"
          rustc --print cfg -C target-cpu=x86-64 \
            | grep -E 'target_feature="(bmi2|avx2|avx512f)"' \
            || echo "bmi2/avx2/avx512f TIDAK aktif (baseline x86-64)"

      - name: Disk sebelum build
        run: df -h /

      - uses: Swatinem/rust-cache@v2
        with:
          # Tag ISA ikut di kunci. Tanpa itu cache `target/` dari build sebelum
          # RUSTFLAGS dipin dipulihkan apa adanya, dan artefak lama yang memuat
          # BMI2 ikut terpaket seolah-olah hasil build baru.
          key: build-x86-64-baseline-cflags-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Build
        run: |
          set -o pipefail
          cargo build --locked --package browserd --profile ${{ inputs.profile || 'release' }} --verbose 2>&1 | tee /tmp/build.log

      - name: Diagnostik perintah rustc
        if: always()
        run: |
          echo "--- variabel yang bisa menimpa RUSTFLAGS ---"
          env | grep -iE "^(RUSTFLAGS|CARGO_ENCODED_RUSTFLAGS|CARGO_BUILD_RUSTFLAGS|RUSTC|RUSTC_WRAPPER|CARGO_HOME)=" || true
          echo "--- perintah rustc untuk crate browserd ---"
          grep -m1 -- "--crate-name browserd " /tmp/build.log \
            | tr ' ' '\n' \
            | grep -nE "target-cpu|target-feature|^-[CO]$" \
            | head -20 || echo "(tidak ditemukan di log)"

      # Gate ISA hanya melihat biner akhir, jadi ia bisa bilang "ada 14 movbe"
      # tanpa memberi tahu SIAPA pembuatnya. Langkah ini menjawab pertanyaan itu
      # di sumbernya: objek C mana (ring) dan arsip crate mana yang membawa
      # opcode non-baseline, plus flag yang benar-benar dipakai `cc`. Tanpa ini
      # tiap perbaikan ISA jadi tebakan yang diuji lewat run CI berikutnya.
      - name: Diagnostik ISA per objek
        if: always()
        run: |
          echo "--- perintah cc yang dipakai build ini ---"
          grep -oE 'running: [^ ]*(cc|gcc|clang)[^ ]* .*' /tmp/build.log 2>/dev/null \
            | head -3 || echo "(tidak ada perintah cc di log)"
          echo "--- env CFLAGS yang dilihat build ---"
          env | grep -E '^(CFLAGS|CXXFLAGS)' || echo "(kosong)"
          echo "--- objek ring yang membawa opcode non-baseline ---"
          find target -path '*ring*/out/*.o' -type f 2>/dev/null | while read -r o; do
            n=$(objdump -d "$o" 2>/dev/null \
              | grep -cE '\b(sarx|shlx|shrx|bzhi|pdep|pext|mulx|rorx|movbe|andn|blsr|blsi|blsmsk|bextr|adcx|adox)\b' || true)
            [ "$n" -gt 0 ] && echo "$n  $(basename "$o")"
          done | sort -rn | head -15
          echo "--- arsip crate (.rlib) yang membawa movbe ---"
          find target -name '*.rlib' -type f 2>/dev/null | while read -r r; do
            n=$(objdump -d "$r" 2>/dev/null | grep -cE '\bmovbe' || true)
            [ "$n" -gt 0 ] && echo "$n  $(basename "$r")"
          done | sort -rn | head -15
          echo "(selesai)"

      - name: Probe apakah rustc menghormati baseline
        run: |
          set -eu
          mkdir -p /tmp/probe && cd /tmp/probe
          printf 'fn main(){ let x: u64 = std::env::args().count() as u64; println!("{}", x >> 3); }\n' > p.rs
          rustc -C opt-level=2 $RUSTFLAGS p.rs -o p
          N=$(objdump -d p | grep -cE '\b(sarx|shlx|shrx|bzhi|pdep|pext|mulx|rorx|movbe|andn|blsr|blsi|blsmsk|bextr|adcx|adox)\b' || true)
          echo "probe ISA non-baseline pada biner hello-world: ${N}"
          echo "probe RUSTFLAGS: ${RUSTFLAGS}"

      - name: Gate portabilitas ISA
        run: |
          set -eu
          PROFILE="${{ inputs.profile || 'release' }}"
          case "$PROFILE" in
            dev) DIR=debug ;;
            *) DIR="$PROFILE" ;;
          esac
          BIN="target/${DIR}/browserd"
          test -x "$BIN"

          # Baseline x86-64 tidak punya BMI2, dan artefak yang memakainya di
          # jalur yang SELALU dieksekusi mati "Illegal instruction" di CPU
          # pemakai (run 43531270141 mati tepat di `sarx`).
          #
          # Sisa BMI2 di biner ini berasal dari asm ring 0.17.14 yang dipilih
          # saat RUNTIME lewat CPUID, jadi tidak pernah dieksekusi di CPU tanpa
          # BMI2. Daftar putih di bawah eksplisit per simbol; tiap entri punya
          # jalur dispatch yang bisa dibaca di sumber crate:
          #   x25519_scalar_mult_adx, fiat_curve25519_adx_{mul,square}
          #     src/ec/curve25519/x25519.rs:127 if ops::has_fe25519_adx(cpu_features)
          #     -> ops.rs:161 matches!(cpu.get_feature(), Some((Adx, Bmi1, Bmi2)))
          #   ecp_nistz256_ord_{mul,sqr}_mont_adx, __ecp_nistz256_{mul,sqr}_montx
          #     crypto/fipsmodule/ec/p256-nistz.c:133 if (adx_bmi2_available);
          #     __ecp_nistz256_*x hanya dipanggil dari *_adx (p256-x86_64-asm.pl:1751)
          #   bn_mulx4x_mont, mulx4x_internal, bn_sqrx8x_internal
          #     src/arithmetic/limbs/x86_64/mont.rs:213
          #     if maybe_adx_bmi1_bmi2.is_some() { bn_mulx4x_mont_gather5 }
          #   chacha20_poly1305_{seal,open}_avx2
          #     src/aead/chacha20_poly1305/integrated.rs:122
          #     if matches!(optional_cpu_features, Some((Avx2, Bmi2)))
          #   _aesni_ctr32_ghash_6x, _aesni_ctr32_6x, aesni_gcm_{encrypt,decrypt}
          #     `movbe` berasal dari asm pregenerated aesni-gcm-x86_64-elf.S, dan
          #     varian itu hanya dipilih lewat CPUID: src/aead/aes_gcm.rs:92
          #     memasang DynKey::AesHwClMulAvxMovbe lewat gcm::clmulavxmovbe::Key.
          #     Sandy Bridge tidak punya movbe, jadi jatuh ke AesHwClMul biasa.
          #   __bn_postx4x_internal (4 instruksi)
          #     hanya dipanggil bn_powerx5 (x86_64-mont5-elf.S:2264-2272), dan
          #     bn_powerx5 dipanggil di mont.rs:266 di dalam
          #     if maybe_adx_bmi1_bmi2.is_some() — jalur nohw dipakai kalau tidak.
          #   fiat_mulx_u64 (3 instruksi)
          #     didefinisikan third_party/fiat/curve25519_64_adx.h, hanya
          #     di-include crypto/curve25519/curve25519_64_adx.c yang mengisi
          #     x25519_scalar_mult_adx; pemanggilnya dijaga
          #     x25519.rs:127 if ops::has_fe25519_adx(cpu_features), dan fungsi
          #     itu sendiri matches!(cpu.get_feature(), Some((Adx, Bmi1, Bmi2))).
          #
          # Nama simbol memuat versi crate, jadi upgrade ring otomatis
          # menggugurkan daftar ini dan gate gagal sampai jalur barunya
          # diaudit. Simbol yang tidak dikenal SELALU dihitung pelanggaran:
          # gate ini gagal-tertutup.
          IZIN="ring_core_0_17_14__x25519_scalar_mult_adx ring_core_0_17_14__fiat_curve25519_adx_mul ring_core_0_17_14__fiat_curve25519_adx_square ring_core_0_17_14__ecp_nistz256_ord_mul_mont_adx ring_core_0_17_14__ecp_nistz256_ord_sqr_mont_adx __ecp_nistz256_mul_montx __ecp_nistz256_sqr_montx ring_core_0_17_14__bn_mulx4x_mont mulx4x_internal ring_core_0_17_14__bn_sqrx8x_internal ring_core_0_17_14__chacha20_poly1305_seal_avx2 ring_core_0_17_14__chacha20_poly1305_open_avx2 ring_core_0_17_14__aesni_ctr32_ghash_6x ring_core_0_17_14__aesni_ctr32_6x ring_core_0_17_14__aesni_gcm_decrypt ring_core_0_17_14__aesni_gcm_encrypt _aesni_ctr32_ghash_6x _aesni_ctr32_6x aesni_gcm_decrypt aesni_gcm_encrypt __bn_postx4x_internal ring_core_0_17_14__bn_postx4x_internal fiat_mulx_u64"

          # Daftar opcode di bawah adalah instruksi yang TIDAK ada di baseline
          # x86-64 (Sandy Bridge ke bawah) dan tidak dikodekan ulang CPU lama.
          # `movbe` masuk daftar setelah run 43539289311: gate lama hanya
          # menghitung BMI2, sehingga biner yang membawa movbe lolos lalu mati
          # SIGILL di `keygen`. Gate yang tidak mengenal opcode-nya adalah gate
          # yang tidak menjaga apa pun.
          objdump -d "$BIN" \
            | grep -E '\b(sarx|shlx|shrx|bzhi|pdep|pext|mulx|rorx|movbe|andn|blsr|blsi|blsmsk|bextr|adcx|adox)\b' \
            | sed -E 's/^ *([0-9a-f]+):.*/\1/' > /tmp/hits.txt || true
          TOTAL=$(wc -l < /tmp/hits.txt)
          if [ "$TOTAL" -eq 0 ]; then
            echo "ISA non-baseline total: 0 (tidak ada sama sekali)"
            exit 0
          fi
          addr2line -f -e "$BIN" $(sed 's/^/0x/' /tmp/hits.txt) \
            | awk 'NR % 2 == 1' > /tmp/syms.txt
          echo "ISA non-baseline total: ${TOTAL}"
          echo "--- sebaran per simbol ---"
          sort /tmp/syms.txt | uniq -c | sort -rn | head -20
          for s in $IZIN; do echo "$s"; done > /tmp/izin.txt
          ILEGAL=$(grep -vxF -f /tmp/izin.txt /tmp/syms.txt | wc -l || true)
          echo "ISA non-baseline di luar daftar putih: ${ILEGAL}"
          if [ "${ILEGAL}" -ne 0 ]; then
            echo "artefak tidak portabel: ${ILEGAL} instruksi non-baseline di simbol yang tidak diaudit" >&2
            grep -vxF -f /tmp/izin.txt /tmp/syms.txt | sort | uniq -c | sort -rn >&2
            exit 1
          fi
          echo "semua opcode non-baseline ada di jalur ring yang dipilih lewat CPUID, baseline aman"

      - name: Ukuran target sebelum dibersihkan
        if: always()
        run: du -sh target 2>/dev/null || true

      - name: Disk sesudah build
        if: always()
        run: df -h /

      - name: Paketkan
        id: paket
        run: |
          set -eu
          PROFILE="${{ inputs.profile || 'release' }}"
          # Cargo menamai direktori keluaran menurut profil BAWAAN yang dipetakan,
          # bukan menurut nama profilnya: `--profile dev` mendarat di target/debug/.
          # Tanpa peta ini `test -x` gagal tanpa satu baris pesan karena `set -eu`,
          # dan itu yang terjadi di run 42445740212 (build ok, Paketkan exit 1).
          case "$PROFILE" in
            dev) DIR=debug ;;
            *) DIR="$PROFILE" ;;
          esac
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          BIN="target/${DIR}/browserd"
          if [ ! -x "$BIN" ]; then
            echo "biner tidak ditemukan: $BIN (profil=$PROFILE, dir=$DIR)" >&2
            ls -l "target/${DIR}" 2>/dev/null || ls -l target 2>/dev/null || true
            exit 1
          fi
          strip "$BIN" || true
          NAME="browserd-${VERSION}-x86_64-unknown-linux-gnu"
          tar -C "target/${DIR}" -czf "${NAME}.tar.gz" browserd
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          ls -l "${NAME}.tar.gz"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.paket.outputs.name }}
          path: |
            ${{ steps.paket.outputs.name }}.tar.gz
            ${{ steps.paket.outputs.name }}.tar.gz.sha256
          retention-days: 14

      - name: Rilis (hanya untuk tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          NAME="${{ steps.paket.outputs.name }}"
          gh release create "$GITHUB_REF_NAME" \
            "${NAME}.tar.gz" "${NAME}.tar.gz.sha256" \
            --title "browserd $GITHUB_REF_NAME" \
            --notes "Biner x86_64-unknown-linux-gnu. Checksum disertakan; verifikasi dengan \`sha256sum -c\`."