name: CI

# Jalur A (dokumen 06 §0): gerbang cepat di setiap push dan PR.
# Isinya persis sama dengan `cargo xtask check` di laptop, supaya hijau lokal
# dan hijau di sini artinya hal yang sama.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental menulis puluhan MB ke disk runner 14 GB tanpa mempercepat
  # build sekali pakai (dokumen 08 §1 batas 1).
  CARGO_INCREMENTAL: "0"
  # .cargo/config.toml memaksa jobs = 2 untuk laptop 4 core. Runner punya
  # 4 core sendiri, jadi di sini dilonggarkan.
  CARGO_BUILD_JOBS: "4"

jobs:
  gate:
    name: gate (fmt + clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Toolchain dipin oleh rust-toolchain.toml, bukan action yang bergerak
      # sendiri (dokumen 08 §3).
      - name: Toolchain
        run: |
          rustup show active-toolchain
          rustc -vV
          cargo -V

      - name: Disk sebelum build
        run: df -h /

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked

      # Kontrak CDP ujung ke ujung terhadap daemon native sungguhan. `cargo test`
      # membuktikan tiap potongan; hanya langkah ini yang membuktikan
      # rangkaiannya, dan hanya di sini daemon yang dikirim benar-benar dijalankan.
      # Binernya dibangun eksplisit karena `cargo test` tidak selalu menghasilkan
      # `target/debug/browserd`.
      - name: e2e
        run: |
          cargo build -p browserd --locked
          cargo xtask e2e

      # Kehabisan disk harus terlihat sebagai kegagalan yang jelas, bukan galat
      # linker yang membingungkan.
      - name: Disk sesudah build
        if: always()
        run: df -h /

  # Anggaran PSS daemon ditegakkan pada profil `release`, karena binary itulah
  # yang dikirim ke pengguna dan hanya angka itulah yang dirasakan mesin.
  #
  # Percobaan pertama memakai profil antara (`inherits = "release"` dengan
  # `lto = false`, `codegen-units = 16`) supaya build-nya ringan. Itu salah dan
  # gate-nya sendiri yang membuktikannya: daemon profil antara itu terukur
  # **109,3 MB** pada 99 tab, sementara binary release terukur 89,9 dan 89,3 MB.
  # Tanpa LTO, ~20 MB hilang ke kode yang tidak di-inline. Gate yang mengukur
  # binary yang tidak pernah dikirim cuma punya dua akhir: merah permanen, atau
  # pagu dinaikkan sampai tidak berarti apa-apa.
  #
  # Job terpisah, bukan step di `gate`: profil release tidak berbagi artefak
  # dengan profil dev, jadi build-nya dingin dan lama. Batas waktunya sendiri
  # supaya gerbang cepat tetap cepat, dan supaya build dingin tidak pernah
  # terbaca sebagai "gate timeout" yang menyamar jadi kegagalan kode.
  budget:
    name: budget (PSS daemon 99 tab, release)
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup show active-toolchain
          rustc -vV

      - name: Disk sebelum build
        run: df -h /

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: test daemon budget
        run: cargo test -p browserd --test native_daemon_budget --release --locked -- --nocapture

      - name: Disk sesudah build
        if: always()
        run: df -h /